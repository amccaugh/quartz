server {
    listen 8080;
    server_name qittlab-nuc-01.campus.nist.gov localhost;
    
    # Serve attachments from external directory with original filenames
    location /attachments/ {
        alias /home/qittlab/qittlab-blog-attachments/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Handle files with spaces and special characters in names
        try_files $uri $uri/ =404;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        
        # Enable gzip compression for better performance
        gzip on;
        gzip_types image/png image/jpeg image/gif image/webp application/pdf;
    }
    
    # Proxy all other requests to Quartz
    location / {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle WebSocket connections for live reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
